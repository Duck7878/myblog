baseURL = "https://example.org/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"
paginate = 10
enableEmoji = true

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "reading"
    name = "阅读档案"
    url = "/reading/"
    weight = 20

[params]
  description = "个人博客"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNaviator = true
  ShowToc = true

  [params.label]
    text = "我的博客"

  [params.homeInfoParams]
    Title = "欢迎来到我的博客"
    Content = "记录阅读、学习与思考"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"
